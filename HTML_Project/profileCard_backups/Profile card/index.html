<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile-Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="profilecard">
        <header>
            <div class="caption">Sambavi's Profile</div>

        </header>
        <section>
            <div class="main">
                <div class="card">
                    <div class="front">
                        <div class="logo"><img src="./assets/logo3.avif" alt="user-logo"></div>
                        <div class="content">
                            <h2>Sambavi Anunathan</h2>
                            <h5>@sambavi</h5>
                            <h4>A webdeveloper fond of learning</h4>
                        </div>
                        <div class="buttons">
                            <div id="view"><button>View Profile</button></div>
                            <div id="send_message"><button>Message Me</button></div>

                        </div>
                    </div>
                    <!-- <div class="icons">
                        <br><br>
                        <i class="fa-brands fa-dev fa-2xl"></i>
                        <i class="fa-brands fa-github fa-2xl"></i>
                        <i class="fa-brands fa-linkedin fa-2xl"></i>
                    </div> -->
                    <div class="back">
                        <div class="formdiv">
                            <div class="form_top">
                                <label for="name">Your Name:</label>
                                <input type="text" name="name" id="name"><br><br>
                                <label for="emailid">Your Email id:</label>
                                <input type="email" name="email-id" id="email"><br><br>
                                <label for="comment"> Message: </label>
                                <textarea id="comment" name="Message" rows="4" cols="15"></textarea>
                            </div>
                            <div class="form_bottom">
                                
                                <button id="back">Back</button>
                                <button id="send_mail">Send Mail</button>


                            </div>
                        </div>
                    </div>
                </div>

            </div>


        </section>
        <footer>
            <div class="icons">
                        <br><br>
                        <i class="fa-brands fa-dev fa-2xl"></i>
                        <i class="fa-brands fa-github fa-2xl"></i>
                        <i class="fa-brands fa-linkedin fa-2xl"></i>
                    </div>
            <div class="follows">
                <div class="follows1">
                    <h2>55</h2>
                    <h3> Followers</h3>
                </div>
                <div class="follows2">
                    <h2>33</h2>
                    <h3> Following</h3>
                </div>
                <div class="follows3">
                    <h2>183</h2>
                    <h3> Repositories</h3>
                </div>


            </div>

        </footer>




    </div>


</body>

</html>
