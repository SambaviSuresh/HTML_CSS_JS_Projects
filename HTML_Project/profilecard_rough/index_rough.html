<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header><button class="profile button0">Profile</button></header>
    <section><div class="profile_card">        
        <form action="https://www.google.com">
            <div class="card_front">
        <div class="child child1"><img src="./samples/logo3.avif" alt="user-logo" ></div>
        <div class="child child2"><h2>sambavi</h2>
             <h3>Senior Webdeveloper</h3></div> <br><br> 
             <i class="fa-brands fa-dev fa-2xl"></i>    
             <i class="fa-brands fa-github fa-2xl"></i>
             <i class="fa-brands fa-linkedin fa-2xl"></i> <br><br>              
             <button class="profile button1">View Details</button>
             <button class="profile button2">Message</button>
            </div>

            <div class="card_back">
                <label for="name"> Your Name: </label>
                <input type="text" id="name" name="name_text">
                <label for="mailid"> Your Mailid: </label>
                <input type="email" id="mailid" name="emailid">


            </div>


    </form></div>
</section> 
<footer>
<div class="follows">
   <div class="follows1"><h2>55</h2>
    <h3> Followers</h3></div>
   <div class="follows2"><h2>33</h2>
    <h3> Following</h3></div>
   <div class="follows3"><h2>183</h2>
    <h3> Repositories</h3></div>      


</div>

</footer>
</body>
</html>
