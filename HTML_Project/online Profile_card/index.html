
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flip Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
  <div class="flip-container">
    <div class="flip-inner-container">
        <div class="flip-front">
            <div class="profile-image1">
                
            </div>
            <h3>Haina</h3>
            <h6>Graphic Designier<br>Cartoon Artist</h6>
            <div class="credit">Made with <span style="color:tomato;font-size:20px;">❤ </span>by<a href="https://www.learningrobo.com/"> Learning Robo</a></div>
        </div>
        <div class="flip-back">
           <h2>Learning robo</h2>
           <form>
            <input type="text" placeholder="Your name">
            <input type="text" placeholder="Your email">
            <textarea placeholder="Your message" rows="5"></textarea>
            <input type="submit" value="Send">
          </form>
          <div class="social-icons">
            <a href="#"><i class="fa fa-facebook"></i></a>
            <a href="#"><i class="fa fa-twitter"></i></a>
            <a href="#"><i class="fa fa-linkedin"></i></a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
